  whatsapp:
    name: "WhatsApp"
    kind: "both"
    routes:
      - app: "claude"
        type: "local"
        clicks:
          - "Install Beeper from beeper.com/download and open it. Make a free account with your email."
          - "In Beeper, add WhatsApp. On your phone, open WhatsApp, then Settings (iPhone) or the three dots (Android), then Linked devices, then Link a device. Scan the code on the screen. Keep the phone close while chats load."
          - "In Beeper, open Settings, then Integrations, and check the Desktop API is on."
          - "Go to developers.beeper.com/desktop-api/mcp and click Claude Desktop. Open the file that downloads. If nothing happens: in Claude, open Settings, then Extensions, then Advanced settings, then Install Extension, and choose that file."
          - "When Beeper asks you to approve Claude, click Approve. Pick read-only if it is offered."
