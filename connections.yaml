# connections.yaml: every source the setup can connect, in every AI app, with the exact clicks.
#
# For the AI (setup step 3, "connect"):
# - Work out which app you are in: claude (the Claude app), chatgpt (the ChatGPT app with Codex), cursor,
#   opencode, orca or terminal. A route marked `any` works in every app.
# - Routes are in this order: builtin, custom, local, cli, export. Offer the first route for the person's
#   app that suits them. If its screens do not match, or it fails, go to the next one. The export is
#   always the last resort, and it always works.
# - Give the clicks one at a time, word for word. Wait for "done", then run the proof_read: one harmless
#   read. Never send, change or delete anything to prove a connection.
# - technical_only: true means offer it only to someone who says they are technical. Never push it.
# - checked_on: the date the clicks were checked against the app's official help page. null means not
#   checked yet: say so in one line, and if the screens differ, use the next route.
# - "notes" starting "For the AI" are for you, not to read out.
# - Connections live in the AI app or on the computer, never in the brain folder. Passwords and keys never
#   go in the brain. A file outside the brain folder (an app's own settings) is changed only after a yes.
# - After a connection works, record it with: progress.py <brain> connected <id> <how>
# - To save what you read through a live connection, write it as JSON and run
#   importers/from_connector.py <brain> <file>. It keeps who and when, never whole messages.

sources:
  google-calendar:
    name: "Google Calendar"
    kind: "both"
    routes:
      - app: "claude"
        type: "builtin"
        clicks:
          - "In the Claude app, open Customize, then Connectors."
          - "Click the + next to Connectors and choose Google Calendar."
          - "Click Connect. Sign in to Google and click Allow. Tick only the boxes you are happy with."
          - "Start a new chat. Click + under the message box, choose Connectors, and check Google Calendar is switched on."
          - "Say done."
        proof_read: "List tomorrow's events: times and titles only."
        technical_only: false
        checked_on: "2026-10-19"
        notes: "Every Claude plan. On a Team or Enterprise plan the owner switches it on first (Organisation settings, Connectors). Claude asks before it changes anything. Help: support.claude.com/en/articles/11176164 and 10166901."
      - app: "chatgpt"
        type: "builtin"
        clicks:
          - "In the ChatGPT app, open Settings, then Plugins. (Older apps say Apps.)"
          - "Find Google Calendar and select it. Click Install plugin if you see it, then Connect."
          - "Sign in to Google and click Allow."
          - "In Codex, open Sources, choose Use plugins, and pick Google Calendar."
          - "Say done."
        proof_read: "List tomorrow's events: times and titles only."
        technical_only: false
        checked_on: null
        notes: "The Plugins steps were checked on 19 Oct 2026 (help.openai.com/en/articles/11487775 and 20001256), but no OpenAI page read that day names a Google Calendar app. It depends on your plan and country. If it is not listed, use the export."
      - app: "orca"
        type: "builtin"
        clicks:
          - "Connect Google Calendar in the Claude app or at claude.ai: Customize, then Connectors, then Connect. Use the same Claude account as Claude Code."
          - "Say done."
        proof_read: "List tomorrow's events: times and titles only."
        technical_only: false
        checked_on: "2026-10-19"
        notes: "For the AI: only when the agent inside Orca is Claude Code, signed in with a Claude account (not a key). Connectors added at claude.ai show up in Claude Code by themselves; check with /mcp. With Codex or OpenCode, use the export. Help: code.claude.com/docs/en/mcp."
      - app: "terminal"
        type: "builtin"
        clicks:
          - "Connect Google Calendar in the Claude app or at claude.ai: Customize, then Connectors, then Connect. Use the same Claude account as Claude Code."
          - "Say done."
        proof_read: "List tomorrow's events: times and titles only."
        technical_only: false
        checked_on: "2026-10-19"
        notes: "For the AI: only when the agent is Claude Code, signed in with a Claude account (not a key). Connectors added at claude.ai show up in Claude Code by themselves; check with /mcp. With Codex or OpenCode, use the export. Help: code.claude.com/docs/en/mcp."
      - app: "any"
        type: "cli"
        clicks:
          - "Only if you are happy using a terminal. Install the Google Workspace command-line tool: npm install -g @googleworkspace/cli (it needs Node.js)."
          - "Run: gws auth setup. It walks you through a Google Cloud project and a sign-in (it needs Google's gcloud tool). Allow read access only."
          - "Say done."
        proof_read: "List tomorrow's events with: gws calendar +agenda"
        technical_only: true
        checked_on: "2026-10-19"
        notes: "Takes 20 minutes or more and is easy to get wrong. Not an official Google product. Not in the Claude app's Chat tab, which runs in a sealed-off space. Help: github.com/googleworkspace/cli."
      - app: "any"
        type: "export"
        clicks:
          - "On a computer, go to calendar.google.com."
          - "Click the gear at the top right, then Settings."
          - "On the left, click Import & export. Under Export, click Export. A zip file downloads."
          - "Move the zip into your brain's exports folder. Keep it zipped."
          - "Say done."
        proof_read: "Check the zip is listed when you run kit/check_setup.py on the brain."
        technical_only: false
        checked_on: "2026-10-19"
        notes: "Exports every calendar you own. For one calendar: hover over it under My calendars, click the three dots, Settings and sharing, Export calendar. Help: support.google.com/calendar/answer/37111."

