schedulers:
  claude:
    how: "The Claude app's Scheduled tasks. Your brain is on your computer, so keep the computer on and the app open when a job is due."
    clicks:
      - "Newer app (no Chat and Cowork switch under the message box): in any chat, say what the job is and when, for example: every Monday at 8am, run my weekly review from my brain folder. Check the name, time and instruction, then click Schedule."
      - "Older app (with a Chat and Cowork switch): click Scheduled in the left sidebar, then New task, then Create with Claude. Answer its questions, then click Schedule."
      - "Pick your brain folder if it asks."
    checked_on: "2026-10-19"
  chatgpt:
    how: "Scheduled tasks in the ChatGPT desktop app, made from a Codex chat. Keep the computer on and the app running when a job is due. ChatGPT on the web cannot reach your brain folder."
    clicks:
      - "In a Codex chat on your brain folder, say what the job is and when, for example: every Monday at 8am, run my weekly review."
      - "Check what it proposes, then confirm."
      - "To see or pause jobs later, open Scheduled in the app's sidebar."
    checked_on: "2026-10-19"
  cursor:
    how: "No scheduler that can reach your brain folder: Cursor's Automations run in the cloud. Run the job by hand when a calendar reminder pops up."
    clicks:
      - "Add a repeating event to your own calendar, for example Monday 8:00, Brain: weekly review."
      - "When it pops up, open your brain folder in Cursor and say: run my weekly review."
      - "Technical people can use the computer's own scheduler instead (cron or launchd on a Mac, Task Scheduler on Windows)."
    checked_on: "2026-10-19"
  opencode:
    how: "OpenCode's help pages show no scheduler. Run the job by hand when a calendar reminder pops up."
    clicks:
      - "Add a repeating event to your own calendar, for example Monday 8:00, Brain: weekly review."
      - "When it pops up, open your brain folder in OpenCode and say: run my weekly review."
      - "Technical people can use the computer's own scheduler instead (cron or launchd on a Mac, Task Scheduler on Windows)."
    checked_on: "2026-10-19"
  orca:
    how: "Orca runs Claude Code, Codex or OpenCode. Use that agent's own scheduler (see terminal); otherwise run the job by hand when a calendar reminder pops up."
    clicks:
      - "Add a repeating event to your own calendar, for example Monday 8:00, Brain: weekly review."
      - "When it pops up, open your brain in Orca and say: run my weekly review."
    checked_on: null
  terminal:
    how: "Use the scheduler of the agent you started. Claude Code: a local routine in the Claude app. Codex: Scheduled in the ChatGPT desktop app. OpenCode has none, so run it by hand. Keep the computer on and the app open when a job is due."
    clicks:
      - "Claude Code: in the Claude app, open the Code tab, click Routines, then New routine, then Local. Give it a name, the instruction (for example: run my weekly review), your brain folder and a time. Save it."
      - "Codex: in a Codex chat on your brain folder, say what the job is and when, then confirm."
      - "OpenCode: add a repeating event to your own calendar and run the job by hand when it pops up."
    checked_on: "2026-10-19"
