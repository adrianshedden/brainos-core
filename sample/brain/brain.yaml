# The declared shape of this brain. create_brain.py stamps it; tests/check_brain.py verifies it.
brain_os_version: 2
# Your own name as it shows in your WhatsApp chats, so you are never listed as one of your own contacts.
# Set by the WhatsApp importer the first time you give it --me "<your name>".
whatsapp_names: ["Alex Example"]
domains: [network, work]
